  location: Hamilton, ON, Canada
  image: ""
  summary: >
    I model coherent emission from astrophysical masers, asking whether Dicke
    superradiance can account for the periodic flaring seen in 6.7 GHz methanol
    sources, and I build the numerical tools that make those models possible.

